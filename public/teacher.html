<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher · Speak Mandarin 讲华语</title>
<style>body{font:16px/1.4 "PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;max-width:900px;margin:0 auto;padding:16px;background:#fff6e0;color:#2b2140}h1{margin:.2em 0}section{background:#fff;border-radius:14px;padding:12px;margin:12px 0;box-shadow:0 1px 4px #0002}input,select,button{font:inherit;padding:8px 12px;margin:3px;border-radius:10px;border:1px solid #888}button{background:#2b2140;color:#fff;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #0002;text-align:left}.note{font-size:14px;color:#555}textarea{box-sizing:border-box;font:inherit;width:100%;min-height:110px;padding:8px;border-radius:10px;border:1px solid #888}details{margin:8px 0}summary{cursor:pointer;font-weight:700}.ok{color:#1b7a4b}.bad{color:#b3261e}</style></head>
<body><h1>讲华语 Speak Mandarin: Teacher page</h1><div class="note"><a href="/">← Pupil app</a> · <a href="/admin.html">Admin</a></div><div id="o"></div><script type="module">import {UNITS} from '/zh-data.js';const UNIT_NUMS=Array.from({length:UNITS.length-1},(_,i)=>i+1);
const o=document.getElementById('o');let tok=null;const flash={};
const api=async(p,b)=>{const r=await fetch(p,{method:b?'POST':'GET',headers:{'content-type':'application/json',...(tok?{authorization:'Bearer '+tok}:{})},body:b?JSON.stringify(b):undefined});return{s:r.status,j:await r.json().catch(()=>({}))}};
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const x in a){if(x.startsWith('on'))e.addEventListener(x.slice(2),a[x]);else if(x==='value')e.value=a[x];else if(x==='checked')e.checked=a[x];else e.setAttribute(x,a[x])}e.append(...k.flat().filter(c=>c!=null).map(c=>c.nodeType?c:document.createTextNode(c)));return e};
function login(m){const u=h('input',{placeholder:'username'}),p=h('input',{type:'password',placeholder:'password'});o.replaceChildren(h('section',{},h('b',{},'Sign in'),h('br'),u,p,h('button',{onclick:async()=>{const r=await api('/api/teacher/login',{user:u.value,pass:p.value});if(r.s!==200)return login(r.j.error);tok=r.j.tok;main()}},'Sign in'),h('div',{},m||''),h('div',{class:'note'},'No account? Ask the person who runs the Admin page to make one for you.')))}
async function main(){const cl=(await api('/api/teacher/classes')).j.classes||[],name=h('input',{placeholder:'New class name, e.g. 5A'});
 const secs=[h('section',{},name,h('button',{onclick:async()=>{await api('/api/teacher/class',{name:name.value});main()}},'Create class'))];
 for(const c of cl){const sec=h('section',{},h('h2',{},c.name+'  ·  code '+c.code));
  const chk=(label,key,val)=>h('label',{},h('input',{type:'checkbox',checked:val,onchange:async e=>{await api('/api/teacher/settings',{code:c.code,zh:{[key]:e.target.checked}})}}),' '+label+'  ');
  const pin=h('select',{onchange:async e=>{await api('/api/teacher/settings',{code:c.code,zh:{pinyin:e.target.value}})}},[['tap','Tap to show pinyin'],['on','Always show pinyin'],['off','Never show pinyin']].map(([v,t])=>{const op=h('option',{value:v},t);if(c.cfg.pinyin===v)op.selected=true;return op}));
  const cap=h('select',{onchange:async e=>{await api('/api/teacher/settings',{code:c.code,zh:{unitCap:+e.target.value}})}},UNIT_NUMS.map(n=>{const op=h('option',{value:n},'Up to unit '+n);if(c.cfg.unitCap===n)op.selected=true;return op}));
  const enrol=h('label',{},h('input',{type:'checkbox',checked:c.enrol!=='closed',onchange:async e=>{await api('/api/teacher/settings',{code:c.code,enrol:e.target.checked?'open':'closed'})}}),' Pupils can make their own account with the class code  ');
  sec.append(chk('Chinese room on','on',c.cfg.on),chk('Voice practice on (default off)','voice',c.cfg.voice),pin,cap,h('br'),enrol,h('div',{class:'note'},'Sign-up on: a pupil enters the class code and picks a name. Sign-up off: only pupils you add below can sign in. Voice also needs a parent or guardian to tick yes inside the app. Use first names or nicknames only.'));
  const ta=h('textarea',{placeholder:'One first name or nickname per line\nAli\nBea\nCy',maxlength:'12000'}),cnt=h('span',{class:'note'},''),res=h('div',{class:'ok'},flash[c.code]?.text||'');
  const names=()=>{const seen=new Set();return ta.value.split(/[\r\n,;\t]+/).map(x=>x.replace(/\s+/g,' ').trim().slice(0,30)).filter(x=>x&&!seen.has(x.toLowerCase())&&seen.add(x.toLowerCase()))};
  ta.addEventListener('input',()=>{cnt.textContent=names().length?names().length+' names':''});
  const bulk=h('details',{},h('summary',{},'Add pupils in bulk'),h('div',{class:'note'},'Paste a list from your class register. First names or nicknames only. Names already in the class are skipped.'),ta,h('div',{},h('button',{onclick:async e=>{e.target.disabled=true;const r=await api('/api/teacher/bulk',{code:c.code,names:ta.value});
   if(r.s!==200){e.target.disabled=false;res.className='bad';res.textContent=r.j.error||'Could not add';return}
   flash[c.code]={text:'Added '+r.j.added+(r.j.skipped.length?'. Already in the class, skipped: '+r.j.skipped.join(', '):'')+'.'};main()}},'Add pupils'),cnt),res);
  if(flash[c.code])bulk.open=true;sec.append(bulk);delete flash[c.code];
  const t=h('table',{},h('tr',{},h('th',{},'Pupil'),h('th',{},'Unit'),h('th',{},'Mastered'),h('th',{},'⭐'),h('th',{},'Voice yes'),h('th',{},'')));
  const ps=(await api('/api/teacher/students?code='+c.code)).j.students||[];
  for(const s of ps)t.append(h('tr',{},h('td',{},s.name),h('td',{},h('select',{onchange:async e=>{await api('/api/teacher/unit',{id:s.id,unit:+e.target.value})}},UNIT_NUMS.map(n=>{const op=h('option',{value:n},n);if(s.unit===n)op.selected=true;return op}))),h('td',{},s.mastered),h('td',{},s.xp),h('td',{},s.consent?'yes':'no'),h('td',{},h('button',{onclick:async()=>{if(confirm('Remove '+s.name+' and ALL their data? This cannot be undone.')){await api('/api/teacher/remove',{id:s.id});main()}}},'Remove'))));
  sec.append(t);secs.push(sec)}
 o.replaceChildren(...secs)}
login();</script></body></html>
