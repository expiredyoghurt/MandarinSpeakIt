name = "mandarin-say-it"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "mandarin-say-it"
database_id = "7d651c6b-b6b7-44ba-90db-d734c0e783b0"

# Workers AI (Whisper) is used only when a class has voice switched on and no Azure/Google key is set.
[ai]
binding = "AI"

[vars]
AZURE_REGION = "southeastasia"
SPEECH_LANG = "zh-CN"
GOOGLE_LANG = "cmn-Hans-CN"
